<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskCampus</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 24px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #4338ca; font-size: 32px; font-weight: bold; margin-bottom: 24px; }
        
        /* Contenedores de Estadísticas */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .stat-title { color: #6b7280; font-size: 14px; text-transform: uppercase; font-weight: 600; margin: 0 0 8px 0; }
        .stat-val { font-size: 28px; font-weight: bold; margin: 0; }
        
        /* Distribución de la pantalla */
        .main-layout { display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media (min-width: 768px) { .main-layout { grid-template-columns: 1fr 2fr; } }
        
        /* Tarjetas y Formularios */
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); height: fit-content; }
        .card h2 { font-size: 20px; color: #374151; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #4338ca; box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.15); }
        
        /* Botones */
        button, .btn-submit { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-primary { background-color: #4338ca; color: white; }
        .btn-primary:hover { background-color: #3730a3; }
        .btn-secondary { background-color: #9ca3af; color: white; }
        .btn-secondary:hover { background-color: #7b8089; }
        
        .btn-edit { background-color: #2563eb; color: white; padding: 6px 12px; width: auto; font-size: 13px; border-radius: 4px; margin: 0; }
        .btn-edit:hover { background-color: #1d4ed8; }
        .btn-delete { background-color: #dc2626; color: white; padding: 6px 12px; width: auto; font-size: 13px; border-radius: 4px; margin: 0; }
        .btn-delete:hover { background-color: #b91c1c; }

        /* Filtros */
        .filters { background: white; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .filters span { font-weight: bold; color: #374151; font-size: 14px; }
        .filters select, .filters input { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        .filters input { flex: 1; min-width: 150px; }

        /* Lista de tareas */
        .task-list { display: flex; flex-direction: column; gap: 16px; }
        .task-card { background: white; padding: 20px; border-radius: 8px; border-left: 5px solid #10b981; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .task-info h3 { margin: 0 0 6px 0; font-size: 18px; color: #111827; display: flex; align-items: center; gap: 10px; }
        .task-status { background-color: #e0e7ff; color: #4338ca; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
        .task-desc { margin: 0 0 12px 0; color: #4b5563; font-size: 14px; }
        .task-meta { margin: 0; color: #9ca3af; font-size: 12px; }
        .task-actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TaskCampus - Control de Tareas</h1>

        <!-- Bloque de Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card"><p class="stat-title">Total Tareas</p><p id="stat-total" class="stat-val" style="color: #4338ca;">0</p></div>
            <div class="stat-card"><p class="stat-title">Pendientes</p><p id="stat-pending" class="stat-val" style="color: #d97706;">0</p></div>
            <div class="stat-card"><p class="stat-title">Finalizadas</p><p id="stat-completed" class="stat-val" style="color: #059669;">0</p></div>
            <div class="stat-card"><p class="stat-title">Alta Prioridad</p><p id="stat-high" class="stat-val" style="color: #dc2626;">0</p></div>
        </div>

        <div class="main-layout">
            <!-- Formulario de Registro -->
            <div class="card">
                <h2 id="form-title">Registrar Nueva Tarea</h2>
                <form id="task-form">
                    <input type="hidden" id="task-id">
                    <div class="form-group"><label>Título</label><input type="text" id="title" required></div>
                    <div class="form-group"><label>Descripción</label><textarea id="description" rows="3" required></textarea></div>
                    <div class="form-group"><label>Asignatura / Materia</label><input type="text" id="subject" required></div>
                    <div class="form-group"><label>Fecha de Entrega</label><input type="date" id="due_date" required></div>
                    <div class="form-group">
                        <label>Prioridad</label>
                        <select id="priority">
                            <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="status">
                            <option value="pendiente">Pendiente</option><option value="en proceso">En Proceso</option><option value="finalizada">Finalizada</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Guardar Tarea</button>
                    <button type="button" id="cancel-btn" class="btn-secondary" style="display: none;">Cancelar Edición</button>
                </form>
            </div>

            <!-- Panel de Filtros y Lista de Tareas -->
            <div>
                <div class="filters">
                    <span>Filtrar por:</span>
                    <select id="filter-status"><option value="">Todos los estados</option><option value="pendiente">Pendiente</option><option value="en proceso">En Proceso</option><option value="finalizada">Finalizada</option></select>
                    <select id="filter-priority"><option value="">Todas las prioridades</option><option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option></select>
                    <input type="text" id="filter-subject" placeholder="Buscar materia...">
                </div>
                
                <div id="tasks-container" class="task-list"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
