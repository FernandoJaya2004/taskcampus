<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskCampus</title>
    <!-- Cargamos Tailwind CSS para darle un diseño moderno e inmediato -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="container mx-auto p-6 max-w-6xl">
        <h1 class="text-3xl font-bold text-indigo-700 mb-6 text-center">TaskCampus - Control de Tareas</h1>

        <!-- Bloque de Estadísticas (Requisito RF06) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded shadow text-center"><p class="text-gray-500 text-sm">Total Tareas</p><p id="stat-total" class="text-2xl font-bold text-indigo-600">0</p></div>
            <div class="bg-white p-4 rounded shadow text-center"><p class="text-gray-500 text-sm">Pendientes</p><p id="stat-pending" class="text-2xl font-bold text-yellow-600">0</p></div>
            <div class="bg-white p-4 rounded shadow text-center"><p class="text-gray-500 text-sm">Finalizadas</p><p id="stat-completed" class="text-2xl font-bold text-green-600">0</p></div>
            <div class="bg-white p-4 rounded shadow text-center"><p class="text-gray-500 text-sm">Alta Prioridad</p><p id="stat-high" class="text-2xl font-bold text-red-600">0</p></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Formulario de Registro (Requisitos RF01 y RF03) -->
            <div class="bg-white p-6 rounded shadow h-fit">
                <h2 id="form-title" class="text-xl font-semibold mb-4 text-gray-700">Registrar Nueva Tarea</h2>
                <form id="task-form" class="space-y-3">
                    <input type="hidden" id="task-id">
                    <div><label class="block text-xs font-semibold text-gray-600">Título</label><input type="text" id="title" class="w-full p-2 border rounded mt-1" required></div>
                    <div><label class="block text-xs font-semibold text-gray-600">Descripción</label><textarea id="description" class="w-full p-2 border rounded mt-1" required></textarea></div>
                    <div><label class="block text-xs font-semibold text-gray-600">Asignatura / Materia</label><input type="text" id="subject" class="w-full p-2 border rounded mt-1" required></div>
                    <div><label class="block text-xs font-semibold text-gray-600">Fecha de Entrega</label><input type="date" id="due_date" class="w-full p-2 border rounded mt-1" required></div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600">Prioridad</label>
                        <select id="priority" class="w-full p-2 border rounded mt-1">
                            <option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600">Estado</label>
                        <select id="status" class="w-full p-2 border rounded mt-1">
                            <option value="pendiente">Pendiente</option><option value="en proceso">En Proceso</option><option value="finalizada">Finalizada</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded font-medium hover:bg-indigo-700 transition">Guardar Tarea</button>
                    <button type="button" id="cancel-btn" class="w-full bg-gray-400 text-white p-2 rounded font-medium hidden hover:bg-gray-500 transition">Cancelar Edición</button>
                </form>
            </div>

            <!-- Panel de Filtros y Lista de Tareas (Requisitos RF02, RF04 y RF05) -->
            <div class="md:col-span-2 space-y-4">
                <div class="bg-white p-4 rounded shadow flex flex-wrap gap-4 items-center justify-between">
                    <span class="font-semibold text-gray-700 text-sm">Filtrar por:</span>
                    <select id="filter-status" class="p-2 border rounded text-sm"><option value="">Todos los estados</option><option value="pendiente">Pendiente</option><option value="en proceso">En Proceso</option><option value="finalizada">Finalizada</option></select>
                    <select id="filter-priority" class="p-2 border rounded text-sm"><option value="">Todas las prioridades</option><option value="baja">Baja</option><option value="media">Media</option><option value="alta">Alta</option></select>
                    <input type="text" id="filter-subject" placeholder="Buscar materia..." class="p-2 border rounded text-sm flex-1">
                </div>
                
                <!-- Aquí el Javascript meterá las tarjetas de tareas dinámicamente -->
                <div id="tasks-container" class="space-y-3"></div>
            </div>
        </div>
    </div>
    <!-- Conectamos la interfaz con la lógica funcional -->
    <script src="app.js"></script>
</body>
</html>
